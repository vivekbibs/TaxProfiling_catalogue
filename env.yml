name: taxprofiling-catalogue

channels:
  - conda-forge
  - bioconda

dependencies:
  # ── Python ────────────────────────────────────────
  - python=3.12

  # ── Streamlit ─────────────────
  - streamlit>=1.35
  - streamlit-pdf         # pour afficher le PDF de la homepage

  # ── Dev tools ─────────────────────────────────────
  - black
  - isort
  - mypy
  - pylance          # via pip (pas sur conda-forge)
  - pre-commit

  # ── Data / utils ────────────────────────────
  - requests
  - pandas           # utile pour les tableaux streamlit
  - pydantic         # validation des JSONs si besoin plus tard

  # ── Tests ─────────────────────────────────────────
  - pytest
  - pytest-cov

  # ── pip  ───────────────────────
  - pip
  - pip:
    - pylance
    - streamlit-extras     # composants streamlit supplémentaires