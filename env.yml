name: taxprofiling-catalogue

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ── Python ────────────────────────────────────────
  - python=3.12

  # ── Interface web / questionnaire ─────────────────
  - streamlit>=1.35

  # ── Dev tools ─────────────────────────────────────
  - black
  - isort
  - mypy
  - pylance          # via pip (pas sur conda-forge)
  - pre-commit

  # ── Data / utilitaires ────────────────────────────
  - requests
  - pandas           # utile pour les tableaux streamlit
  - pydantic         # validation des JSONs si besoin plus tard

  # ── Tests ─────────────────────────────────────────
  - pytest
  - pytest-cov

  # ── Packages pip uniquement ───────────────────────
  - pip
  - pip:
    - pylance
    - streamlit-extras     # composants streamlit supplémentaires
    - markitdown           # lecture de pptx/docx si besoin